{{ define "view_identity" }}
<div id="view-identity" class="view-section hidden h-full flex flex-col p-8 items-center">
    <div class="card" style="width: 100%; max-width: 500px;">
        <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
            <div>
                <h3 style="color: white; font-weight: bold;">Identity</h3>
                <p style="color: var(--text-dim);">How you appear to others.</p>
            </div>
            <div style="width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--primary); display: flex; align-items: center; justify-content: center;">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="icon w-8" style="color: var(--primary);"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </div>
        </div>

        <div class="flex-col gap-4" style="display: flex;">
            <div>
                <label style="color: var(--text-dim); font-size: 10px; font-weight: bold; display: block; margin-bottom: 5px;">DISPLAY NAME</label>
                <div style="display: flex; gap: 10px;">
                    <input id="identity-nickname-input" type="text" value="{{ .Nickname }}" placeholder="Anonymous" style="background: var(--bg-app); border: 1px solid var(--border);">
                    <button onclick="App.UI.saveNick()" class="btn-primary">Save</button>
                </div>
            </div>

            <div>
                <label style="color: var(--text-dim); font-size: 10px; font-weight: bold; display: block; margin-bottom: 5px;">ONION ADDRESS</label>
                <div style="background: var(--bg-app); border: 1px solid var(--border); padding: 10px; font-family: monospace; color: var(--text-muted); word-break: break-all; border-radius: 4px;">
                    {{ .OnionAddr }}
                </div>
            </div>

            <div style="text-align: right; color: var(--text-dim); font-size: 10px;">
                Version: {{ .AppVersion }}
            </div>
        </div>
    </div>
</div>
{{ end }}
