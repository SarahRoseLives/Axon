{{ define "scripts" }}
<script>
    // --- ICON SYSTEM (Internal SVG Strings) ---
    const ICONS = {
        'network': '<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>',
        'zap': '<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>',
        'message-square': '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>',
        'shield': '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>',
        'user': '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle>',
        'user-plus': '<path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line>',
        'trash-2': '<polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line>',
        'ban': '<circle cx="12" cy="12" r="10"></circle><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>',
        'send': '<line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>',
        'activity': '<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>',
        'minus-circle': '<circle cx="12" cy="12" r="10"></circle><line x1="8" y1="12" x2="16" y2="12"></line>',
        'cloud-off': '<path d="M22.61 16.95A5 5 0 0 0 18 10h-1.26a8 8 0 0 0-7.05-6M5 5a8 8 0 0 0 4 7h5a5 5 0 0 0 1.74-2.85M1 1l22 22"></path>',
        'check': '<polyline points="20 6 9 17 4 12"></polyline>',
        'loader': '<line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line>'
    };

    // UPDATED: Now explicitly adds fill="none" and stroke="currentColor"
    function renderIcon(name, classes = "") {
        const path = ICONS[name] || '';
        return `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon ${classes}">${path}</svg>`;
    }

    let activePeer = null;
    let globalPeerData = [];
    let latestFeedHTML = '';
    let onlineNodeCount = 0;

    // --- HELPER FUNCTION: Stable Hash Code ---
    function hashCode(str) {
        let hash = 0;
        if (str.length === 0) return hash;
        for (let i = 0; i < str.length; i++) {
            const char = str.charCodeAt(i);
            hash = ((hash << 5) - hash) + char;
            hash |= 0;
        }
        return Math.abs(hash);
    }

    // --- HELPER FUNCTION: Relative Time ---
    function timeAgo(date) {
        const seconds = Math.floor((new Date() - new Date(date)) / 1000);
        let interval = Math.floor(seconds / 31536000);
        if (interval > 1) return interval + "y";
        interval = Math.floor(seconds / 2592000);
        if (interval > 1) return interval + "mo";
        interval = Math.floor(seconds / 86400);
        if (interval > 1) return interval + "d";
        interval = Math.floor(seconds / 3600);
        if (interval > 1) return interval + "h";
        interval = Math.floor(seconds / 60);
        if (interval > 1) return interval + "m";
        return Math.floor(seconds) + "s";
    }

    // Function to determine inferred status based on LastSeen
    function getInferredStatus(peer) {
        const lastSeen = new Date(peer.last_seen);
        const now = new Date();
        const diffSeconds = Math.floor((now - lastSeen) / 1000);

        if (diffSeconds < 300) { 
            return { status: 'online', color: 'emerald', icon: 'zap' };
        } else if (diffSeconds < 3600) { 
            return { status: 'idle', color: 'amber', icon: 'minus-circle' };
        } else { 
            return { status: 'offline', color: 'slate', icon: 'cloud-off' };
        }
    }

    // --- MANAGEMENT ACTIONS ---
    async function deletePeer() {
        if(!activePeer || !confirm("Delete this peer and all chat history?")) return;
        try {
            await fetch('/api/peers/delete', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ onion_address: activePeer })
            });
            alert("Peer deleted.");
            window.location.reload();
        } catch(e) { alert("Error deleting."); }
    }

    async function toggleBlockPeer() {
        if(!activePeer) return;
        try {
            const res = await fetch('/api/peers/block', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ onion_address: activePeer })
            });
            const data = await res.json();
            alert(data.blocked ? "Peer Blocked." : "Peer Unblocked.");
        } catch(e) { alert("Error updating block status."); }
    }

    // --- Render Peer Table ---
    function renderPeerList(peers) {
        const container = document.getElementById('peer-list-container');
        if (!container) return;

        peers.sort((a, b) => a.onion_address.localeCompare(b.onion_address));

        if (peers.length === 0) {
            container.innerHTML = `<div class="p-8 text-center text-slate-500 text-sm">No peers found. Click the ${renderIcon('user-plus', 'w-4 h-4 inline mx-1')} icon above to add one.</div>`;
            return;
        }

        const html = peers.map(p => {
            const date = new Date(p.last_seen);
            const timeStr = date.toLocaleTimeString([], { hour12: false });
            const displayName = p.nickname || p.onion_address;
            const blockedClass = p.blocked ? "opacity-50 grayscale" : "";
            const blockedText = p.blocked ? '<span class="text-red-500 text-[10px] ml-2">BLOCKED</span>' : "";
            const statusInfo = getInferredStatus(p);
            const introText = p.introduced_by ? `<div class="text-[10px] text-slate-600 mt-0.5">via ${p.introduced_by.substring(0,8)}...</div>` : "";

            return `
            <div class="grid grid-cols-12 gap-4 text-sm py-3 px-2 border-b border-slate-800/50 hover:bg-slate-800/50 cursor-pointer transition-colors group ${blockedClass}" onclick="openChat('${p.onion_address}', '${p.nickname}')">
                <div class="col-span-6 font-mono text-slate-400 truncate group-hover:text-cyan-400" title="${p.onion_address}">
                    ${displayName} ${blockedText}
                    ${introText}
                </div>
                <div class="col-span-3 flex items-center gap-1 text-slate-400">
                    ${renderIcon('shield', 'w-3 h-3 text-emerald-500')} ${p.trust_level}
                </div>
                <div class="col-span-3 text-right text-slate-500 text-xs">
                    <span class="text-${statusInfo.color}-400">${statusInfo.status}</span> / ${timeStr}
                </div>
            </div>`;
        }).join('');

        if (container.innerHTML.length !== html.length) {
            container.innerHTML = html;
        }
    }

    // --- Render Chat Sidebar ---
    function renderChatSidebar(peers, chatStatusMap) {
        const container = document.getElementById('chat-peer-list');
        if (!container) return;

        peers.sort((a, b) => {
            const statA = chatStatusMap[a.onion_address] || {};
            const statB = chatStatusMap[b.onion_address] || {};
            if (statA.unread !== statB.unread) return statA.unread ? -1 : 1;
            if (statA.last_active && statB.last_active) {
                return new Date(statB.last_active) - new Date(statA.last_active);
            }
            return 0;
        });

        const html = peers.map(p => {
            const status = chatStatusMap[p.onion_address] || {};
            const isActive = activePeer === p.onion_address;
            const activeClass = isActive ? 'bg-slate-800 border-l-2 border-cyan-500' : 'border-l-2 border-transparent hover:bg-slate-800/50';

            let badge = '';
            if (status.unread && !isActive) {
                badge = `<div class="w-2 h-2 rounded-full bg-red-500 shadow-md shadow-red-500/50"></div>`;
            }

            const snippet = status.snippet || "No messages yet";
            const snippetClass = status.unread ? 'text-slate-200 font-medium' : 'text-slate-500';
            const displayName = p.nickname || p.onion_address;
            const blockedIcon = p.blocked ? renderIcon('ban', 'w-3 h-3 text-amber-500 ml-1') : '';

            return `
            <div onclick="openChat('${p.onion_address}', '${p.nickname}')" class="p-3 cursor-pointer transition-all ${activeClass} border-b border-slate-800/50">
                <div class="flex justify-between items-start mb-1">
                    <span class="font-medium text-sm text-slate-200 truncate w-32 flex items-center" title="${p.onion_address}">
                        ${displayName} ${blockedIcon}
                    </span>
                    ${badge}
                </div>
                <div class="text-[10px] ${snippetClass} font-mono truncate">${snippet}</div>
            </div>`;
        }).join('');

        if (container.innerHTML.length !== html.length && html.length > 0) {
            container.innerHTML = html;
        } else if (peers.length === 0) {
                container.innerHTML = '<div class="p-4 text-xs text-slate-600 text-center italic">No peers found.</div>';
        }
    }

    // --- Render Topology Map ---
    function renderTopology(peers, selfAddress) {
        const nodesContainer = document.getElementById('topology-nodes');
        const svg = document.getElementById('topology-svg');
        const container = document.getElementById('topology-container');
        if (!nodesContainer || !container || !svg) return;

        const w = container.clientWidth; const h = container.clientHeight;
        const cx = w / 2; const cy = h / 2;
        const RADIUS_INNER = Math.min(w, h) / 4.0;
        const RADIUS_OUTER = Math.min(w, h) / 2.2;

        const directPeers = peers.filter(p => !p.introduced_by);
        const transitivePeers = peers.filter(p => p.introduced_by);

        directPeers.sort((a, b) => hashCode(a.onion_address) - hashCode(b.onion_address));
        transitivePeers.sort((a, b) => hashCode(a.onion_address) - hashCode(b.onion_address));

        const coords = {};
        onlineNodeCount = 1;

        function calculateRingPositions(peerList, radius, startAngle = 0) {
            const numPeers = peerList.length;
            if (numPeers === 0) return;
            const angleStep = (2 * Math.PI) / numPeers;

            peerList.forEach((p, index) => {
                const hashOffset = (hashCode(p.onion_address) % 100) / 1000;
                const angle = startAngle + (index * angleStep) + hashOffset;
                const px = cx + radius * Math.cos(angle);
                const py = cy + radius * Math.sin(angle);
                coords[p.onion_address] = { x: px, y: py, data: p };
                if (getInferredStatus(p).status === 'online') {
                    onlineNodeCount++;
                }
            });
        }

        calculateRingPositions(directPeers, RADIUS_INNER);

        const transitiveGroups = {};
        transitivePeers.forEach(p => {
            if (p.introduced_by) {
                if (!transitiveGroups[p.introduced_by]) transitiveGroups[p.introduced_by] = [];
                transitiveGroups[p.introduced_by].push(p);
            }
        });

        for (const introducerID in transitiveGroups) {
            const group = transitiveGroups[introducerID];
            const introducerCoord = coords[introducerID];
            if (!introducerCoord) continue;

            const introAngle = Math.atan2(introducerCoord.y - cy, introducerCoord.x - cx);
            const groupAngularSpan = Math.PI / 3;
            const groupStartAngle = introAngle - (groupAngularSpan / 2);
            const groupAngleStep = groupAngularSpan / group.length;

            group.forEach((p, index) => {
                const finalAngle = groupStartAngle + (index * groupAngleStep);
                const px = cx + RADIUS_OUTER * Math.cos(finalAngle);
                const py = cy + RADIUS_OUTER * Math.sin(finalAngle);
                coords[p.onion_address] = { x: px, y: py, data: p };
                if (getInferredStatus(p).status === 'online') {
                    onlineNodeCount++;
                }
            });
        }

        let html = `
            <div class="absolute transform -translate-x-1/2 -translate-y-1/2 flex flex-col items-center justify-center pointer-events-auto" style="left: ${cx}px; top: ${cy}px">
                    <div class="w-16 h-16 rounded-full bg-slate-900 border-2 border-cyan-500 z-10 flex items-center justify-center shadow-[0_0_20px_rgba(6,182,212,0.3)]">
                        ${renderIcon('user', 'w-6 h-6 text-cyan-500')}
                    </div>
                    <div class="absolute w-24 h-24 rounded-full border border-cyan-500/30 node-pulse z-0"></div>
                    <div class="mt-2 text-[10px] font-mono text-cyan-400 bg-black/50 px-2 py-0.5 rounded border border-cyan-900/50">You</div>
            </div>`;

        svg.innerHTML = '';

        Object.values(coords).forEach(item => {
            const px = item.x; const py = item.y;
            const p = item.data;
            const isDirect = !p.introduced_by;
            const statusInfo = getInferredStatus(p);

            let tx = cx; let ty = cy;
            if (p.introduced_by && coords[p.introduced_by]) {
                tx = coords[p.introduced_by].x;
                ty = coords[p.introduced_by].y;
            }

            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", tx); line.setAttribute("y1", ty);
            line.setAttribute("x2", px); line.setAttribute("y2", py);

            const strokeColor = p.blocked ? "#ef4444" : (isDirect ? "#10b981" : "#f59e0b");
            line.setAttribute("stroke", strokeColor);
            line.setAttribute("stroke-width", "1");
            line.setAttribute("stroke-opacity", "0.3");
            if (!isDirect) line.setAttribute("stroke-dasharray", "4,4");
            svg.appendChild(line);

            const borderColor = p.blocked ? 'border-red-500' : (statusInfo.status === 'online' ? 'border-emerald-500' : 'border-slate-500');
            const textColor = p.blocked ? 'text-red-500' : (statusInfo.status === 'online' ? 'text-emerald-500' : 'text-slate-500');
            const iconName = p.blocked ? 'ban' : statusInfo.icon;
            const opacityClass = statusInfo.status === 'offline' ? 'opacity-50 grayscale' : '';
            const label = p.nickname || p.onion_address.substring(0,8)+"...";

            html += `
            <div onclick="openChat('${p.onion_address}', '${p.nickname}')" class="absolute transform -translate-x-1/2 -translate-y-1/2 flex flex-col items-center justify-center pointer-events-auto cursor-pointer hover:scale-110 transition-transform duration-200 ${opacityClass}" style="left: ${px}px; top: ${py}px" title="${p.onion_address}">
                    <div class="w-12 h-12 rounded-full bg-slate-900 border-2 ${borderColor} z-10 flex items-center justify-center shadow-lg">
                        ${renderIcon(iconName, `w-5 h-5 ${textColor}`)}
                    </div>
                    <div class="mt-2 text-[10px] font-mono text-slate-400 bg-black/50 px-2 py-0.5 rounded border border-slate-800 whitespace-nowrap">${label}</div>
            </div>`;
        });

        nodesContainer.innerHTML = html;
    }

    // --- Chat Actions ---
    function openChat(peerID, nickname) {
        activePeer = peerID;
        switchTab('chat');
        const displayName = (nickname && nickname !== "undefined" && nickname !== "") ? nickname : peerID;
        const headerHtml = `<div class="flex flex-col"><span class="font-bold text-slate-200">${displayName}</span>${nickname ? `<span class="text-[10px] font-mono text-slate-500">${peerID}</span>` : ''}</div>`;
        document.getElementById('active-chat-peer').innerHTML = headerHtml;
        document.getElementById('header-status-dot').classList.remove('bg-slate-600');
        document.getElementById('header-status-dot').classList.add('bg-emerald-500');
        const input = document.getElementById('chat-input');
        input.disabled = false;
        input.placeholder = `Message ${displayName}...`;
        input.focus();
        const btn = document.getElementById('chat-send-btn');
        btn.disabled = false;
        btn.classList.remove('bg-cyan-900', 'text-slate-500', 'cursor-not-allowed');
        btn.classList.add('bg-cyan-600', 'text-white', 'hover:bg-cyan-500');
        pollChat();
    }

    async function sendChat(e) {
        e.preventDefault();
        if(!activePeer) return;
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if(!text) return;
        input.value = '';
        try {
            await fetch('/api/chat/send', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ to: activePeer, content: text })
            });
            pollChat();
        } catch(err) { console.error("Send failed", err); }
    }

    async function pollChat() {
        if (!activePeer || document.getElementById('view-chat').classList.contains('hidden')) return;
        try {
            const res = await fetch(`/api/chat/history?peer=${activePeer}`);
            const msgs = await res.json();
            const container = document.getElementById('chat-messages');
            if(!container) return;
            if(msgs.length === 0) {
                container.innerHTML = `<div class="text-center mt-10 text-slate-600 text-xs">Start a conversation...</div>`;
                return;
            }
            const html = msgs.map(m => {
                const isMe = !m.incoming;
                const align = isMe ? 'items-end' : 'items-start';
                const bg = isMe ? 'bg-cyan-900/20 border-cyan-800/50 text-cyan-100' : 'bg-slate-800 border-slate-700 text-slate-200';
                const time = new Date(m.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                let statusIcon = '';
                if (isMe) {
                    if (m.status === 'sent') statusIcon = '<span class="text-emerald-500 text-[10px]">✓</span>';
                    else if (m.status === 'pending') statusIcon = '<span class="text-slate-500 text-[10px]">🕒</span>';
                }
                return `<div class="flex flex-col ${align}"><div class="max-w-[70%] p-3 rounded-lg text-sm border ${bg}">${m.content}</div><div class="flex items-center gap-2 mt-1 px-1"><span class="text-[10px] text-slate-600 font-mono">${time}</span>${statusIcon}</div></div>`;
            }).join('');
            if (container.innerHTML.length !== html.length) {
                container.innerHTML = html;
                container.scrollTop = container.scrollHeight;
            }
        } catch(e) { console.error("Chat poll failed", e); }
    }

    // --- Feed Actions ---
    async function sendFeedPost(e) {
        e.preventDefault();
        const input = document.getElementById('feed-input');
        const text = input.value.trim();
        if (!text) return;
        input.value = '';
        try {
            await fetch('/api/feed/send', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ content: text })
            });
            setTimeout(pollFeed, 500);
        } catch(err) { console.error("Feed post failed", err); }
    }

    async function pollFeed() {
        if (document.getElementById('view-feed').classList.contains('hidden')) return;
        try {
            const res = await fetch('/api/feed/history');
            const msgs = await res.json();
            const container = document.getElementById('feed-messages');
            if(!container) return;

            const selfOnion = document.getElementById('self-onion-address').innerText.trim();
            const nicknameMap = {};
            globalPeerData.forEach(p => nicknameMap[p.onion_address] = p.nickname);
            nicknameMap[selfOnion] = "You";

            if(msgs.length === 0) {
                container.innerHTML = `<div class="text-center mt-10 text-slate-600 text-xs">Be the first to post!</div>`;
                latestFeedHTML = container.innerHTML;
                return;
            }

            const html = msgs.map(m => {
                const isMe = m.from === selfOnion;
                const fromName = nicknameMap[m.from] || m.from.substring(0, 16) + "...";
                const relativeTime = timeAgo(m.timestamp);
                const fromClass = isMe ? 'text-cyan-400 font-semibold' : 'text-slate-200 font-medium';
                const cardClass = isMe ? 'bg-cyan-900/10 border-cyan-800/50' : 'bg-slate-900/50 border-slate-800';

                return `
                    <div class="border rounded-xl p-4 shadow-md transition-shadow hover:shadow-cyan-900/30 ${cardClass}">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-sm ${fromClass} flex items-center gap-2">
                                ${renderIcon('user', 'w-4 h-4 text-slate-500')}
                                ${fromName}
                            </span>
                            <span class="text-xs text-slate-600 font-mono" title="${new Date(m.timestamp).toLocaleString()}">${relativeTime} ago</span>
                        </div>
                        <p class="text-base text-slate-300 whitespace-pre-wrap py-2">${m.content}</p>
                        <div class="text-[9px] text-slate-700 font-mono truncate pt-2 mt-2 border-t border-slate-900" title="${m.from}">ID: ${m.from}</div>
                    </div>`;
            }).join('');

            if (latestFeedHTML !== html) {
                container.innerHTML = html;
                latestFeedHTML = html;
            }
        } catch(e) { console.error("Feed poll failed", e); }
    }

    // --- FILES ACTIONS (NEW) ---
    async function refreshFiles() {
        await fetch('/api/files/refresh');
        alert("Local library rescanned.");
    }

    async function searchFiles(e) {
        if (e && e.key !== 'Enter') return;
        const query = document.getElementById('file-search-input').value;
        if (!query) return;

        const res = await fetch(`/api/files/search?q=${encodeURIComponent(query)}`);
        const files = await res.json();
        const container = document.getElementById('file-results');
        
        if (!files || files.length === 0) {
            container.innerHTML = `<div class="col-span-full text-center mt-10 text-slate-600 text-sm">No files found matching "${query}"</div>`;
            return;
        }

        container.innerHTML = files.map(f => {
            const sizeMB = (f.size / 1024 / 1024).toFixed(2);
            return `
            <div class="bg-slate-900/50 border border-slate-800 p-4 rounded-lg flex justify-between items-center hover:border-cyan-900/50 transition-colors">
                <div class="overflow-hidden mr-4">
                    <div class="font-medium text-slate-200 truncate" title="${f.name}">${f.name}</div>
                    <div class="text-xs text-slate-500 font-mono mt-1 flex gap-3">
                        <span>${sizeMB} MB</span>
                        <span class="text-cyan-600">Owner: ${f.owner.substring(0,8)}...</span>
                    </div>
                </div>
                <button onclick="downloadFile('${f.owner}', '${f.id}', '${f.name}', ${f.size})" class="bg-cyan-900/30 hover:bg-cyan-900/50 text-cyan-400 p-2 rounded transition-colors border border-cyan-900/50">
                    ${renderIcon('zap', 'w-5 h-5')}
                </button>
            </div>`;
        }).join('');
    }

    async function downloadFile(peerID, fileID, fileName, size) {
        if(!confirm(`Download ${fileName}? This will use Tor bandwidth.`)) return;
        
        await fetch('/api/files/download', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ peer_id: peerID, file_id: fileID, file_name: fileName, size: size })
        });
        // Start polling transfers immediately
        pollTransfers();
    }

    async function pollTransfers() {
        const view = document.getElementById('view-files');
        if (view.classList.contains('hidden')) return;

        const res = await fetch('/api/files/status');
        const transfers = await res.json();
        const container = document.getElementById('transfer-list');
        const wrapper = document.getElementById('transfer-container');

        if (!transfers || transfers.length === 0) {
            wrapper.classList.add('hidden');
            return;
        }
        
        wrapper.classList.remove('hidden');
        container.innerHTML = transfers.map(t => {
            const pct = Math.round(t.progress * 100);
            const color = t.status === 'completed' ? 'bg-emerald-500' : 'bg-cyan-500';
            const icon = t.status === 'completed' ? 'check' : 'loader';
            return `
            <div class="bg-black/30 border border-slate-800 rounded p-2 text-xs">
                <div class="flex justify-between mb-1 text-slate-300">
                    <span class="truncate w-2/3">${t.name}</span>
                    <span>${pct}%</span>
                </div>
                <div class="w-full bg-slate-800 rounded-full h-1.5">
                    <div class="${color} h-1.5 rounded-full transition-all duration-500" style="width: ${pct}%"></div>
                </div>
            </div>`;
        }).join('');
    }

    // --- Main Poll Loop ---
    setInterval(async () => {
        try {
            const resPeers = await fetch('/api/peers');
            if (!resPeers.ok) return;
            const dataPeers = await resPeers.json();
            globalPeerData = dataPeers.peers || [];
            const peers = globalPeerData;
            const selfAddr = dataPeers.self || "";

            const resStatus = await fetch('/api/chat/status');
            let chatStatusMap = {};
            let totalUnread = 0;
            if (resStatus.ok) {
                const statusData = await resStatus.json() || [];
                statusData.forEach(s => {
                    chatStatusMap[s.peer_id] = s;
                    if(s.unread) totalUnread++;
                });
            }

            const netView = document.getElementById('view-network');
            if (netView && !netView.classList.contains('hidden')) {
                    renderTopology(peers, selfAddr);
                    const allNodes = peers.length + 1;
                    document.getElementById('hud-node-count-all').innerText = allNodes;
                    document.getElementById('hud-node-count-online').innerText = onlineNodeCount;
                    renderPeerList(peers);
            }

            const chatView = document.getElementById('view-chat');
            if (chatView && !chatView.classList.contains('hidden')) {
                renderChatSidebar(peers, chatStatusMap);
                pollChat();
            }

            const feedView = document.getElementById('view-feed');
            if (feedView && !feedView.classList.contains('hidden')) {
                pollFeed();
            }

            const filesView = document.getElementById('view-files');
            if (filesView && !filesView.classList.contains('hidden')) {
                pollTransfers();
            }

            const badge = document.getElementById('nav-chat-badge');
            if(badge) {
                if (totalUnread > 0) badge.classList.remove('hidden');
                else badge.classList.add('hidden');
            }
        } catch(e) { console.error("Poll cycle failed", e); }
    }, 1500);

    function switchTab(tabId) {
        document.querySelectorAll('.nav-btn').forEach(btn => {
            const isActive = btn.dataset.target === tabId;
            btn.classList.toggle('bg-cyan-950/30', isActive);
            btn.classList.toggle('text-cyan-400', isActive);
            btn.classList.toggle('border-cyan-900/50', isActive);
            btn.classList.toggle('text-slate-400', !isActive);
            btn.classList.toggle('border-transparent', !isActive);
        });
        document.querySelectorAll('.view-section').forEach(view => {
            view.classList.toggle('hidden', view.id !== `view-${tabId}`);
        });
        const titles = { 
            'network': 'Network Topology', 
            'chat': 'Secure Channel', 
            'identity': 'Node Identity', 
            'feed': 'Mesh Feed',
            'files': 'Distributed Library'
        };
        document.getElementById('header-title').innerText = titles[tabId];
    }

    function saveNickname() {
        const input = document.getElementById('identity-nickname-input');
        const newName = input.value.trim();
        if (newName) {
            fetch('/api/identity', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ nickname: newName })
            }).then(() => {
                alert("Nickname saved!");
            }).catch(e => alert("Error saving nickname."));
        }
    }

    async function promptAddPeer() {
        const onion = prompt("Enter Peer Onion Address:");
        if (!onion) return;
        try {
            const res = await fetch('/api/peers/add', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ onion_address: onion }) });
            if (res.status === 409) alert("Peer exists.");
        } catch (e) { alert("Error."); }
    }

    switchTab('network');
</script>
{{ end }}
