{{ define "view_feed" }}
<div id="view-feed" class="view-section hidden h-full flex flex-col max-w-3xl mx-auto py-8 px-6">
    <h3 class="mb-6 border-b border-main pb-2">Mesh Feed</h3>

    <div class="mb-8 p-4 card shadow-sm">
        <form class="flex flex-col gap-3" onsubmit="App.Feed.send(event)">
            <textarea id="feed-input" placeholder="Broadcast to mesh (max 280 chars)..." rows="3" maxlength="280" class="bg-app border-main"></textarea>
            <div class="flex justify-end">
                <button type="submit" class="btn btn-primary">
                    Broadcast <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="icon w-4 ml-2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </form>
    </div>

    <div id="feed-messages" class="flex-1 overflow-auto pb-4">
        <div class="text-center mt-10 text-dim">Waiting for posts...</div>
    </div>
</div>
{{ end }}
