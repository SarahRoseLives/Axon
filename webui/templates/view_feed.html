{{ define "view_feed" }}
<div id="view-feed" class="view-section hidden h-full flex flex-col max-w-4xl mx-auto py-8 px-4 md:px-8">
	<h3 class="text-2xl font-bold text-slate-100 mb-6 border-b border-slate-800 pb-2">Mesh Feed</h3>

	<div class="mb-6 p-4 bg-slate-900/50 border border-slate-800 rounded-xl">
		<form id="feed-form" class="flex flex-col gap-3" onsubmit="sendFeedPost(event)">
			<textarea
				id="feed-input"
				placeholder="Post a public message to all peers in the mesh (max 280 chars)..."
				rows="3"
				maxlength="280"
				class="w-full bg-slate-800 border-none rounded-md px-4 py-3 text-sm text-slate-200 focus:ring-1 focus:ring-cyan-500 outline-none resize-none"
			></textarea>
			<button type="submit" class="self-end bg-cyan-600 hover:bg-cyan-500 text-white px-6 py-2 rounded-md text-sm font-medium transition-colors shadow-lg shadow-cyan-900/20">
				Broadcast Post <i data-lucide="send" class="w-4 h-4 inline ml-1"></i>
			</button>
		</form>
	</div>

	<div id="feed-messages" class="flex-1 overflow-y-auto space-y-4">
		<div class="text-center mt-10 text-slate-600 text-xs">Waiting for mesh posts...</div>
	</div>
</div>
{{ end }}
