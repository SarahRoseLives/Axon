{{ define "base" }}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXON // Mesh Network</title>
    <style>
        :root {
            /* DARK THEME */
            --bg-app: #0b1120;
            --bg-panel: #111827;
            --bg-card: #1f2937;
            --border: #374151;
            --text-bright: #f9fafb;
            --text-main: #d1d5db;
            --text-dim: #6b7280;
            --primary: #06b6d4;
            --success: #10b981;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            height: 100vh; width: 100vw; overflow: hidden;
            background-color: var(--bg-app);
            color: var(--text-main);
            font-family: monospace;
            font-size: 14px;
            display: flex;
        }

        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .flex-1 { flex: 1; min-height: 0; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .gap-2 { gap: 0.5rem; }
        .hidden { display: none !important; }
        .relative { position: relative; }
        .absolute { position: absolute; }
        .h-full { height: 100%; }
        .w-full { width: 100%; }
        .p-4 { padding: 1rem; }
        .px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }

        /* Elements */
        .card { background-color: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; padding: 1rem; }

        .btn-primary {
            background-color: var(--primary); color: #fff; padding: 0.5rem 1rem;
            border-radius: 4px; border: none; cursor: pointer; display: flex; align-items: center; gap: 0.5rem;
        }

        .nav-btn {
            width: 100%; display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem;
            color: var(--text-dim); cursor: pointer; border: 1px solid transparent; background: transparent;
        }
        .nav-btn.active { color: var(--primary); background: rgba(6,182,212,0.1); border-color: rgba(6,182,212,0.2); }
        .nav-btn:hover { color: var(--text-bright); }

        input {
            background: #000; border: 1px solid var(--border); color: #fff; padding: 0.5rem; width: 100%;
        }

        .icon { width: 1.25rem; height: 1.25rem; stroke: currentColor; fill: none; stroke-width: 2; display: block; }
        .w-4 { width: 1rem; height: 1rem; }
        .w-5 { width: 1.25rem; height: 1.25rem; }

        /* Grid BG */
        .grid-bg {
            background-image: radial-gradient(#374151 1px, transparent 1px);
            background-size: 20px 20px; opacity: 0.2;
        }
    </style>
</head>
<body>
    {{ template "content" . }}
    {{ template "scripts" . }}
</body>
</html>
{{ end }}
