{{ define "base" }}
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>AXON // Mesh Network</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<script src="https://unpkg.com/lucide@latest"></script>
	<style>
		::-webkit-scrollbar { width: 6px; height: 6px; }
		::-webkit-scrollbar-track { background: #0f172a; }
		::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
		::-webkit-scrollbar-thumb:hover { background: #06b6d4; }
		.pattern-dots { background-image: radial-gradient(#334155 1px, transparent 1px); background-size: 8px 8px; }
		@keyframes gentle-pulse {
			0%, 100% { transform: scale(1); opacity: 0.5; }
			50% { transform: scale(1.1); opacity: 0.2; }
		}
		.node-pulse { animation: gentle-pulse 3s infinite; }
	</style>
</head>
<body class="bg-slate-950 text-slate-200 font-sans selection:bg-cyan-900 selection:text-cyan-100 overflow-hidden h-screen w-full flex">

	{{ template "content" . }}

	{{ template "scripts" . }}
</body>
</html>
{{ end }}
