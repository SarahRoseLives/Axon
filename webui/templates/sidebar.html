{{ define "sidebar" }}
<div class="w-20 md:w-64 flex flex-col border-r border-slate-800 bg-slate-900">
    <div class="h-16 flex items-center justify-center md:justify-start md:px-6 border-b border-slate-800">
        <div class="w-8 h-8 rounded-lg bg-cyan-600 flex items-center justify-center shadow-lg">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="icon w-5 h-5 text-white"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
        </div>
        <span class="hidden md:block ml-3 font-bold text-xl tracking-tight text-slate-200">AXON</span>
    </div>

    <nav class="flex-1 py-6 space-y-2 px-3">
        <button onclick="switchTab('network')" class="nav-btn active w-full flex items-center gap-3 px-3 py-2 rounded-md transition-all bg-cyan-950/30 text-cyan-400 border border-cyan-900/50" data-target="network">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="icon w-5 h-5"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
            <span class="hidden md:block font-medium text-sm">Topology</span>
        </button>
        <button onclick="switchTab('feed')" class="nav-btn w-full flex items-center gap-3 px-3 py-2 rounded-md transition-all text-slate-400 hover:text-slate-200 border border-transparent" data-target="feed">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="icon w-5 h-5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
            <span class="hidden md:block font-medium text-sm">Mesh Feed</span>
        </button>
        <button onclick="switchTab('files')" class="nav-btn w-full flex items-center gap-3 px-3 py-2 rounded-md transition-all text-slate-400 hover:text-slate-200 border border-transparent" data-target="files">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="icon w-5 h-5"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><polyline points="13 2 13 9 20 9"></polyline></svg>
            <span class="hidden md:block font-medium text-sm">Library</span>
        </button>
        <button onclick="switchTab('chat')" class="nav-btn w-full flex items-center gap-3 px-3 py-2 rounded-md transition-all text-slate-400 hover:text-slate-200 border border-transparent relative" data-target="chat">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="icon w-5 h-5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            <span class="hidden md:block font-medium text-sm">Comms</span>
            <div id="nav-chat-badge" class="hidden absolute top-2 right-2 md:right-auto md:left-6 w-2 h-2 rounded-full bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.6)]"></div>
        </button>
        <button onclick="switchTab('identity')" class="nav-btn w-full flex items-center gap-3 px-3 py-2 rounded-md transition-all text-slate-400 hover:text-slate-200 border border-transparent" data-target="identity">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="icon w-5 h-5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
            <span class="hidden md:block font-medium text-sm">Identity</span>
        </button>
    </nav>
    <div class="p-4 border-t border-slate-800">
        <div class="flex items-center gap-3">
            <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
            <span class="hidden md:block text-xs font-mono text-slate-400 truncate w-full">
                Status: {{ .Status }}
            </span>
        </div>
    </div>
</div>
{{ end }}
