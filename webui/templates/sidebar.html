{{ define "sidebar" }}
<div style="width: 250px; background: var(--bg-panel); border-right: 1px solid var(--border); display: flex; flex-direction: column;">
    <div style="height: 60px; display: flex; align-items: center; padding-left: 20px; border-bottom: 1px solid var(--border);">
        <span style="color: var(--primary); font-weight: bold; font-size: 18px;">AXON</span>
    </div>

    <nav class="flex-1 p-4">
        <button onclick="App.UI.switchTab('network')" class="nav-btn active" data-target="network">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="icon w-5"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
            Topology
        </button>
        <button onclick="App.UI.switchTab('chat')" class="nav-btn" data-target="chat">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="icon w-5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            Comms
        </button>
        <button onclick="App.UI.switchTab('files')" class="nav-btn" data-target="files">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="icon w-5"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><polyline points="13 2 13 9 20 9"></polyline></svg>
            Library
        </button>
        <button onclick="App.UI.switchTab('feed')" class="nav-btn" data-target="feed">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="icon w-5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
            Feed
        </button>
        <button onclick="App.UI.switchTab('identity')" class="nav-btn" data-target="identity">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="icon w-5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
            Identity
        </button>
    </nav>

    <div class="p-4" style="border-top: 1px solid var(--border);">
        <div style="font-size: 10px; color: var(--text-dim);">STATUS: {{ .Status }}</div>
    </div>
</div>
{{ end }}
