{{ define "view_network" }}
<div id="view-network" class="view-section h-full flex flex-col">
    <div class="flex-1 relative" id="topology-container" style="background: var(--bg-app);">
        <div class="absolute inset-0 grid-bg pointer-events-none"></div>
        <svg id="topology-svg" class="absolute inset-0 w-full h-full pointer-events-none z-0"></svg>
        <div id="topology-nodes" class="absolute inset-0 w-full h-full z-10 pointer-events-none"></div>

        <div class="card" style="position: absolute; top: 20px; right: 20px; width: 200px; z-index: 20;">
            <div style="color: var(--primary); font-weight: bold; border-bottom: 1px solid var(--border); margin-bottom: 8px;">STATUS</div>
            <div class="flex justify-between"><span>Nodes</span> <span id="hud-node-count-all" style="color: white;">0</span></div>
            <div class="flex justify-between"><span>Active</span> <span id="hud-node-count-online" style="color: var(--success);">1</span></div>
        </div>
    </div>

    <div style="height: 30%; border-top: 1px solid var(--border); background: var(--bg-panel); overflow: auto;">
        <div class="p-4" style="border-bottom: 1px solid var(--border); color: var(--text-dim); font-weight: bold;">NEIGHBORS</div>
        <div id="peer-list-container"></div>
    </div>
</div>
{{ end }}
