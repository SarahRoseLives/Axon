{{ define "view_chat" }}
<div id="view-chat" class="view-section hidden h-full flex">
    <div class="w-64 border-r border-main bg-panel flex flex-col">
        <div class="p-3 border-b border-main">
            <input type="text" placeholder="Filter contacts..." class="text-sm bg-app">
        </div>
        <div id="chat-peer-list" class="flex-1 overflow-auto">
             <div class="p-4 text-xs text-dim text-center italic mt-4">Loading contacts...</div>
        </div>
    </div>

    <div class="flex-1 flex flex-col bg-app">
        <div class="h-16 border-b border-main flex items-center px-6 justify-between bg-panel">
            <div class="flex items-center gap-3">
                <div class="w-2 h-2 rounded-full bg-border-main" id="header-status-dot"></div>
                <div>
                    <div id="active-chat-peer" class="text-sm font-bold text-bright">No Peer Selected</div>
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="App.UI.blockPeer()" class="btn-icon" title="Block">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="icon w-4"><circle cx="12" cy="12" r="10"></circle><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line></svg>
                </button>
                <button onclick="App.UI.deletePeer()" class="btn-icon hover:text-red" title="Delete">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="icon w-4"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                </button>
            </div>
        </div>

        <div id="chat-messages" class="flex-1 overflow-auto p-6 space-y-4 flex flex-col">
            <div class="flex justify-center mt-20 opacity-20">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="icon w-16 text-dim"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            </div>
        </div>

        <div class="p-4 border-t border-main bg-panel">
            <form class="flex gap-3" onsubmit="App.Chat.send(event)">
                <input id="chat-input" type="text" placeholder="Select a peer to chat..." disabled class="bg-app border-main">
                <button type="submit" id="chat-send-btn" class="btn btn-primary" disabled>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="icon w-5"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </form>
        </div>
    </div>
</div>
{{ end }}
